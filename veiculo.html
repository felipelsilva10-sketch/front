<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Document</title>
</head>
<body>

<header class="header">
    <a href="index.html" class="header-brand">
        <img src="unnamed.png" alt="Logo da Ricardo's Motors" class="logo-header">
        <h1>Ricardo's Motors</h1>
    </a>
    <div class="header-user">
        <p>Olá, usuário!</p>
        <a href="usuario.html" aria-label="Área do usuário"><i class="fa-solid fa-circle-user"></i></a>
    </div>
</header>

<section class="menu-lateral">
    <nav>
        <ul class="menu-lista">
            <li><a href="paginainicial.html"><i class="fa-solid fa-house"></i>Página Inicial</a></li>
            <li><a href="cliente.html"><i class="fa-solid fa-user"></i>Cadastro Clientes</a></li>
            <li><a href="veiculo.html"><i class="fa-solid fa-car"></i>Cadastro Veículos</a></li>
            <li><a href="agendamento.html"><i class="fa-solid fa-calendar"></i>Agendamentos</a></li>
            <li><a href="listagem-clientes.html"><i class="fa-solid fa-users"></i>Listar clientes</a></li>
            <li><a href="listagem-agendamentos.html"><i class="fa-solid fa-calendar-days"></i>Listar agendamentos</a></li>
            <li><a href="index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i>Sair</a></li>
        </ul>
    </nav>
</section>

<main>
    <section class="login-section">
        <h1>Ricardo's Motors</h1>
        <img src="unnamed.png" alt="Logo da Ricardo's Motors" class="logo-form">
        <h2>Cadastro de Veículos</h2>

        <form action="#" method="POST" class="login-form">
            <div class="form-group">
                <label for="username">Marca:</label>
                <input type="text" id="username" name="username" placeholder="Digite a marca do veículo" required>
            </div>

            <div class="form-group">
                <label for="modelo">Modelo:</label>
                <input type="text" id="modelo" name="modelo" placeholder="Digite o modelo do veículo" required>
            </div>

            <div class="form-group">
                <label for="placa">Placa:</label>
                <input type="text" id="placa" name="placa" placeholder="Digite a placa do veículo" required>
            </div>

            <div class="form-group">
                <label for="cpf">Dono:</label>
                <input type="text" id="dono" name="dono" placeholder="Digite o nome do dono" required>
            </div>

            <a href="paginainicial.html"><button type="button">Cadastrar</button></a>
        </form>
    </section>
</main>

</body>
</html>
