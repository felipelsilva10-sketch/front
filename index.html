<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo's Motors | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="unnamed.png" type="image/x-icon">
</head>

<body>

    <main>

        <section class="login-section">
            <h1>Ricardo's Motors</h1>
            <img src="unnamed.png" alt="Logo da Ricardo's Motors" class="logo">
            <h2>Login</h2>
            <form action="#" method="POST" class="login-form">
                <div class="form-group">
                    <label for="username">Usuário:</label>

                    <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
                </div>

                <a href="paginainicial.html">
                    <button type="button">Entrar</button></a>
            </form>
        </section>
    </main>
</body>

</html>
